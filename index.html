<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dosha Balance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #F8F5EE;
      color: #294537;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: white;
      border-radius: 30px;
      padding: 45px 25px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 {
      color: #5D8A63;
      font-size: 34px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 20px;
      font-weight: normal;
      margin-bottom: 25px;
    }

    p {
      line-height: 1.9;
      font-size: 17px;
      color: #52665A;
      margin-bottom: 30px;
    }

    .start-button {
      border: none;
      border-radius: 30px;
      padding: 16px 38px;
      background: #5D8A63;
      color: white;
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(93,138,99,.25);
    }

    .start-button:hover {
      opacity: .9;
      transform: scale(1.02);
    }

    .note {
      margin-top: 25px;
      font-size: 13px;
      color: #87958B;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">🌿</div>

    <h1>Dosha Balance</h1>

    <h2>اكتشفي توازنك الداخلي</h2>

    <p>
      اختبار بسيط يساعدك على التعرف على طبيعة الدوشا
      لديك، واكتشاف نصائح مناسبة للغذاء واليوغا ونمط الحياة.
    </p>

    <button
      class="start-button"
      onclick="location.href='quiz.html'">
      ابدئي اختبار الدوشا ✨
    </button>

    <div class="note">
      خذي الاختبار بهدوء واختاري الإجابة الأقرب إليكِ 🌸
    </div>

  </div>

</body>
</html>
