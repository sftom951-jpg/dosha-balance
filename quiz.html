<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Dosha Balance - اختبار الدوشا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #F8F5EE;
      color: #294537;
      font-family: Tahoma, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 650px;
      margin: 25px auto;
      background: white;
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      color: #5D8A63;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .progress-container {
      width: 100%;
      height: 9px;
      background: #E8E4DA;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #5D8A63;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .question-number {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .question {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 25px;
      color: #294537;
    }

    .option {
      width: 100%;
      padding: 17px 15px;
      margin: 12px 0;
      border: 2px solid #E5E1D8;
      background: #FFFDF9;
      border-radius: 18px;
      color: #294537;
      font-family: inherit;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      border-color: #5D8A63;
      background: #F4F8F3;
    }

    .option:active {
      transform: scale(0.98);
    }

    .result {
      text-align: center;
    }

    .result h2 {
      color: #5D8A63;
      font-size: 30px;
      margin-bottom: 15px;
    }

    .result-name {
      font-size: 27px;
      font-weight: bold;
      margin: 20px 0;
      color: #294537;
    }

    .result-text {
      font-size: 17px;
      line-height: 1.9;
      color: #555;
    }

    .restart {
      border: none;
      background: #5D8A63;
      color: white;
      padding: 15px 30px;
      border-radius: 30px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      margin-top: 25px;
    }

    .restart:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 500px) {

      body {
        padding: 12px;
      }

      .card {
        margin: 10px auto;
        padding: 24px 17px;
      }

      .question {
        font-size: 19px;
      }

      .option {
        font-size: 16px;
        padding: 15px 12px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      🌿 Dosha Balance
    </div>

    <div class="subtitle">
      اكتشفي طبيعتك التكوينية
    </div>

    <div id="quizArea">

      <div class="progress-container">
        <div id="progress" class="progress"></div>
      </div>

      <div id="questionNumber" class="question-number"></div>

      <div id="question" class="question"></div>

      <div id="options"></div>

    </div>

    <div id="resultArea" class="result hidden">

      <h2>نتيجتك</h2>

      <div id="resultName" class="result-name"></div>

      <div id="resultText" class="result-text"></div>

      <button class="restart" onclick="restartQuiz()">
        إعادة الاختبار
      </button>

    </div>

  </div>


  <!-- ملف الأسئلة -->
  <script src="script.js"></script>


  <script>

    let quizIndex = 0;

    let quizScores = {
      vata: 0,
      pitta: 0,
      kapha: 0
    };


    function startQuiz() {

      quizIndex = 0;

      quizScores = {
        vata: 0,
        pitta: 0,
        kapha: 0
      };

      document.getElementById("quizArea").classList.remove("hidden");
      document.getElementById("resultArea").classList.add("hidden");

      showQuestion();
    }


    function showQuestion() {

      if (typeof questions === "undefined") {

        document.getElementById("question").innerHTML =
          "حدث خطأ في تحميل الأسئلة.<br><br>تأكدي من وجود ملف script.js في نفس المجلد.";

        return;
      }


      if (quizIndex >= questions.length) {

        showResult();

        return;
      }


      const current = questions[quizIndex];

      document.getElementById("questionNumber").textContent =
        "السؤال " + (quizIndex + 1) + " من " + questions.length;


      document.getElementById("question").textContent =
        current.q;


      const optionsContainer =
        document.getElementById("options");

      optionsContainer.innerHTML = "";


      current.options.forEach(function(option) {

        const button =
          document.createElement("button");

        button.className = "option";

        button.textContent = option[0];

        button.onclick = function() {

          chooseAnswer(option[1]);

        };

        optionsContainer.appendChild(button);

      });


      const progress =
        ((quizIndex) / questions.length) * 100;

      document.getElementById("progress").style.width =
        progress + "%";
    }


    function chooseAnswer(type) {

      if (type === "vata") {
        quizScores.vata++;
      }

      if (type === "pitta") {
        quizScores.pitta++;
      }

      if (type === "kapha") {
        quizScores.kapha++;
      }


      quizIndex++;

      showQuestion();
    }


    function showResult() {

      document.getElementById("quizArea").classList.add("hidden");

      document.getElementById("resultArea").classList.remove("hidden");

      document.getElementById("progress").style.width = "100%";


      let resultType = "";


      if (
        quizScores.vata >= quizScores.pitta &&
        quizScores.vata >= quizScores.kapha
      ) {

        resultType = "vata";

      } else if (
        quizScores.pitta >= quizScores.vata &&
        quizScores.pitta >= quizScores.kapha
      ) {

        resultType = "pitta";

      } else {

        resultType = "kapha";

      }


      const names = {

        vata: "فاتا Vata",

        pitta: "بيتا Pitta",

        kapha: "كافا Kapha"

      };


      const descriptions = {

        vata:
          "تتميز طبيعة فاتا بالحركة والخفة والمرونة. قد تستفيد من الروتين المنتظم، والدفء، والراحة، والأطعمة المغذية.",

        pitta:
          "تتميز طبيعة بيتا بالنشاط والقوة والتركيز. قد تستفيد من التوازن والهدوء والأطعمة المنعشة وتجنب الإفراط في الإجهاد.",

        kapha:
          "تتميز طبيعة كافا بالثبات والهدوء والقوة. قد تستفيد من الحركة المنتظمة، والنشاط، والأطعمة الخفيفة والمتنوعة."

      };


      document.getElementById("resultName").textContent =
        names[resultType];


      document.getElementById("resultText").textContent =
        descriptions[resultType];

    }


    function restartQuiz() {

      startQuiz();

    }


    startQuiz();

  </script>

</body>

</html>
